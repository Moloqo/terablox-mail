<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terablox Mail — @terablox.store</title>
<style>
/* Terablox Mail v2 — redesign: wizard 3 langkah, bahasa sederhana, status selalu terlihat.
   Satu file, tanpa server, tanpa font eksternal. Semua panggilan Resend lewat Worker kamu.
   API key Resend TIDAK pernah ada di file ini. Yang disimpan di localStorage browser ini:
   URL Worker + kata sandi, nama pengirim, daftar terkirim lokal, tanda sudah dibaca. */
:root{
  --bg:#f7f4ee; --surface:#ffffff; --surface-2:#faf8f3; --text:#1c1917; --dim:#78716c;
  --border:#e8e0d3; --accent:#b45309; --accent-strong:#92400e; --accent-soft:#fef3c7;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2; --warn:#b45309;
  --radius:18px; --shadow:0 1px 2px rgba(28,25,23,.05),0 10px 30px -18px rgba(28,25,23,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer} input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- Header: merek + status koneksi (selalu terlihat) ---------- */
.header{position:sticky;top:0;z-index:20;background:rgba(247,244,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px}
.brand-name{font-weight:800;font-size:17px;line-height:1.2;white-space:nowrap}
.brand-sub{font-size:12.5px;color:var(--dim);white-space:nowrap}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap}
.status .dot{width:9px;height:9px;border-radius:50%;background:#a8a29e}
.status.on{color:var(--ok)} .status.on .dot{background:var(--ok)}
.status.off{color:var(--warn)} .status.off .dot{background:#d97706}

/* ---------- Layout: sidebar di desktop, konten di tengah ---------- */
.shell{max-width:1080px;margin:0 auto;padding:18px 16px 120px;display:flex;gap:20px;align-items:flex-start}
.sidebar{flex:0 0 210px;position:sticky;top:86px;display:none}
@media(min-width:900px){ .sidebar{display:block} .main{flex:1;min-width:0} }
.main{flex:1;min-width:0;max-width:760px;margin:0 auto;width:100%}
@media(min-width:900px){ .main{margin:0} }
.side-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-radius:12px;font-size:15px;color:var(--text)}
.side-btn:hover{background:#efe9dd}
.side-btn.active{background:var(--accent-soft);font-weight:700;color:var(--accent-strong)}
.side-btn .count{margin-left:auto;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.side-note{font-size:12.5px;color:var(--dim);line-height:1.6;padding:12px 14px}

/* ---------- Kartu, tombol, form ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
h1{font-size:21px;margin:0} h2{font-size:17px;margin:0 0 4px} h3{font-size:15px;margin:0}
.muted{color:var(--dim);font-size:14px;line-height:1.65}
.small{font-size:13px;color:var(--dim);line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;font-size:14.5px;text-decoration:none}
.btn:hover{border-color:#d6cbb6}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong)}
.btn:disabled{opacity:.55;cursor:default}
.btn-block{width:100%}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;min-height:50px;border:1px solid var(--border);border-radius:12px;padding:0 14px;background:var(--surface);outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface);outline:0;resize:vertical;line-height:1.65}
.hint{font-size:13px;color:var(--dim);line-height:1.6;margin-top:6px}
.err{color:var(--bad);font-size:14px;line-height:1.5}
.oktxt{color:var(--ok);font-size:14px;line-height:1.5;font-weight:600}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;min-width:0}
.icon-btn{width:48px;height:48px;flex:0 0 48px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px}
details.help{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2);margin-top:14px}
details.help summary{cursor:pointer;font-weight:700;font-size:14px}
details.help ol{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.7;color:var(--text)}
details.help code{background:#efe9dd;border-radius:6px;padding:1px 6px;font-size:13px}

/* ---------- Langkah wizard ---------- */
.steps{display:flex;gap:6px;margin:0 0 18px}
.step{flex:1;text-align:center;font-size:12.5px;font-weight:700;color:var(--dim);line-height:1.35}
.step .num{display:inline-flex;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--surface);align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-bottom:6px}
.step.done{color:var(--ok)} .step.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now{color:var(--accent-strong)} .step.now .num{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.progress{height:8px;background:#ece5d8;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- Inbox ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 16px;height:50px;min-width:0}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0}
.list{list-style:none;margin:0;padding:0;overflow:hidden}
.list li{border-bottom:1px solid var(--border)} .list li:last-child{border-bottom:0}
.mail-row{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;padding:15px 16px;align-items:flex-start}
.mail-row:hover{background:var(--surface-2)}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.row-main{flex:1;min-width:0}
.row-top{display:flex;gap:8px;align-items:baseline}
.row-from{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.row-date{flex:0 0 auto;font-size:12px;color:var(--dim)}
.unread .row-from{font-weight:800} .unread .row-date{color:var(--accent);font-weight:700}
.row-subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;display:block}
.unread .row-subj{font-weight:700}
.row-snip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:99px;background:var(--accent);display:inline-block;flex:0 0 9px;margin-top:5px}
.empty{text-align:center;padding:52px 18px;color:var(--dim);line-height:1.65}
.empty b{color:var(--text);display:block;font-size:16px;margin-bottom:6px}
.page-head{display:flex;align-items:baseline;gap:10px;margin:2px 2px 14px;flex-wrap:wrap}
.page-head .spacer{flex:1}
.chip{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;background:var(--surface)}
.chip-accent{color:var(--accent-strong);background:var(--accent-soft);border-color:transparent}

/* ---------- Baca email & tulis ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.overlay-inner{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.overlay-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;z-index:2}
.email-body{font-size:15.5px;line-height:1.75;word-break:break-word}
.email-body img{max-width:100%;height:auto}
pre.plain{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15.5px;line-height:1.75}
.attach{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.fab{position:fixed;right:16px;bottom:96px;z-index:30;height:56px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.22);font-size:15px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;border:0;background:none;padding:8px 4px;font-size:12px;color:var(--dim);border-radius:12px}
.bottomnav button.active{color:var(--accent-strong);font-weight:800;background:var(--accent-soft)}
@media(min-width:900px){ .bottomnav{display:none} .fab{bottom:24px;right:24px} .shell{padding-bottom:40px} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:60;background:#1c1917;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media(min-width:900px){ .toast{bottom:32px} }
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.section-card{margin-bottom:16px}
.kv{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:9px 0;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 130px;font-weight:700}
</style>

<body>
<div id="app"></div>
<div id="toast-root"></div>
<script>
"use strict";
/* Lapisan data — sama seperti v1, kunci localStorage TIDAK berubah (tbm_*)
   supaya pengaturan lama kamu langsung kebawa ke v2. */
/* ALAMAT WORKER PUBLIK — isi sebelum file ini di-host untuk umum.
   Ini BUKAN rahasia: tamu hanya bisa memakai rute publik (alamat tmp- saja,
   hanya baca — lihat worker.js). Kata sandi pemilik TIDAK PERNAH ditulis di sini.
   Contoh: "https://terablox-mail-proxy.akunmu.workers.dev"
   Biarkan "" kalau file ini hanya untuk pemakaian pribadi (mode Tamu akan
   memberitahu pengunjung bahwa mode tamu belum diaktifkan). */
const PUBLIC_WORKER_URL = "https://mail-terablox.lazulias00.workers.dev";
const LS = {
  get(k, fb){ try{ const v = localStorage.getItem("tbm_"+k); return v===null?fb:JSON.parse(v); }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem("tbm_"+k, JSON.stringify(v)); }catch(e){} }
};
let cfg = {
  proxyUrl: LS.get("proxy_url",""),
  proxyPassword: LS.get("proxy_password",""),
  domain: LS.get("domain","terablox.store")
};
let identities = LS.get("identities", []);
let sentLocal = LS.get("sent", []);
let readFlags = LS.get("read", {});
let state = { tab:"inbox", search:"", messages:[], loading:false, error:null, openId:null, detail:null, detailLoading:false, compose:null, toast:null, setupStep:1, lastSync:null, showPass:false, activeAddress: LS.get("active_address","")||"", addrManageOpen:false, mode:"landing", guestAddress: LS.get("guest_address","")||"", guestMessages:[], guestLoading:false, guestError:null, guestOpenId:null, guestDetail:null, guestDetailLoading:false };
function saveCfg(){ LS.set("proxy_url",cfg.proxyUrl); LS.set("proxy_password",cfg.proxyPassword); LS.set("domain",cfg.domain); }
function saveIdent(){ LS.set("identities",identities); }
function saveSent(){ LS.set("sent",sentLocal); }
function saveRead(){ LS.set("read",readFlags); }
function configured(){ return cfg.proxyUrl.trim().length>0 && cfg.proxyPassword.length>0; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseAddress(raw){ const m=String(raw||"").match(/^\s*(.*?)\s*<([^>]+)>\s*$/); if(m) return {name:m[1].replace(/^"|"$/g,""), email:m[2].trim()}; return {name:"", email:String(raw||"").trim()}; }
function displaySender(raw){ const p=parseAddress(raw); return p.name||p.email||"(tidak dikenal)"; }
function initialsOf(raw){ const l=displaySender(raw); if(l.includes("@")){ const local=l.split("@")[0]; const s=local.split(/[._-]+/).filter(Boolean); return (s.length>1?(s[0][0]+s[1][0]):local.slice(0,2)).toUpperCase(); } const p=l.split(/\s+/).filter(Boolean); return (p.length>1?(p[0][0]+p[1][0]):l.slice(0,2)).toUpperCase(); }
function fmtListDate(iso){ const d=new Date(iso), n=new Date(); if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}); const y=new Date(n); y.setDate(n.getDate()-1); if(d.toDateString()===y.toDateString()) return "Kemarin"; if(d.getFullYear()===n.getFullYear()) return d.toLocaleDateString("id-ID",{day:"numeric",month:"short"}); return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); }
function fmtFullDate(iso){ return new Date(iso).toLocaleString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function fmtSize(b){ if(!b&&b!==0) return ""; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
function splitAddresses(v){ return String(v||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean); }
function snippetFrom(text, html){ let s=text||""; if(!s&&html) s=html.replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<[^>]+>/g," "); return s.replace(/\s+/g," ").trim().slice(0,180); }
function textToHtml(text){ const e=esc(text); return e.split(/\n{2,}/).map(p=>"<p>"+p.replace(/\n/g,"<br>")+"</p>").join(""); }
function sanitizeHtml(html){ const doc=new DOMParser().parseFromString(html,"text/html"); doc.querySelectorAll("script,style,iframe,object,embed,form,link,meta,title,noscript,base").forEach(el=>el.remove()); doc.querySelectorAll("*").forEach(el=>{ for(const a of Array.from(el.attributes)){ const n=a.name.toLowerCase(); if(n.startsWith("on")||n==="srcdoc"||n==="formaction") el.removeAttribute(a.name); else if((n==="href"||n==="src"||n==="xlink:href")&&/^\s*(javascript|vbscript|data:text\/html)/i.test(a.value)) el.removeAttribute(a.name); } if(el.tagName==="A"){ el.setAttribute("target","_blank"); el.setAttribute("rel","noopener noreferrer"); } if(el.tagName==="IMG"){ el.setAttribute("style",(el.getAttribute("style")||"")+";max-width:100%;height:auto"); } }); return doc.body.innerHTML; }
function toast(msg){ state.toast=msg; renderToast(); setTimeout(()=>{ state.toast=null; renderToast(); },3600); }
function renderToast(){ document.getElementById("toast-root").innerHTML = state.toast? '<div class="toast">'+esc(state.toast)+"</div>":""; }
</script>
<script>
"use strict";
/* ===== Lapisan proxy: SATU-SATUNYA jalan ke Resend (kontrak worker.js tidak berubah) ===== */
function friendlyResendError(status, data){
  const msg = data && data.message ? data.message : "";
  if(status===401) return "Kata sandi / API key tidak cocok. Cek kata sandi di Worker kamu.";
  if(status===403) return "API key Resend tidak punya izin baca. Pastikan API key dibuat dengan Full access di dashboard Resend.";
  if(status===429) return "Kuota gratis Resend habis (100 email/hari, 3.000/bulan). Coba lagi besok.";
  if(status===422) return "Resend menolak email ini: "+(msg||"alamat atau isi email tidak valid.");
  return msg || ("Resend mengembalikan error ("+status+").");
}
async function proxyFetch(pathSuffix, options){
  const base = cfg.proxyUrl.trim().replace(/\/+$/,"");
  if(!base) throw new Error("Alamat Worker belum diisi. Ikuti langkah 1 dulu ya.");
  let res;
  try{ res = await fetch(base+pathSuffix, options); }
  catch(e){ throw new Error("Tidak bisa menghubungi Worker. Cek alamatnya dan koneksi internet kamu."); }
  const json = await res.json().catch(()=>null);
  if(!res.ok){ throw new Error((json && json.error) || ("Worker mengembalikan error ("+res.status+").")); }
  return json;
}
async function resend(method, path, opts){
  opts = opts||{};
  const json = await proxyFetch("/api/resend", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "X-Proxy-Password": cfg.proxyPassword },
    body: JSON.stringify({ method:method, path:path, query:opts.query||"", body:opts.body })
  });
  const status = json && typeof json.status==="number" ? json.status : 200;
  const data = json ? json.data : null;
  if(status<200 || status>=300) throw new Error(friendlyResendError(status, data));
  return data;
}
async function testConnection(){
  await proxyFetch("/api/health", { method:"GET", headers:{ "X-Proxy-Password": cfg.proxyPassword } });
  const data = await resend("GET","/emails/receiving",{query:"limit=1"});
  return data && Array.isArray(data.data) ? data.data.length : 0;
}
/* ===== Data ===== */
async function loadInbox(){
  if(!configured()){ state.messages=[]; return; }
  state.loading=true; state.error=null; render();
  try{
    let all=[], after=null, hasMore=true, page=0;
    while(hasMore && page<5){
      const q = new URLSearchParams({limit:"100"}); if(after) q.set("after",after);
      const data = await resend("GET","/emails/receiving",{query:q.toString()});
      const items = data && Array.isArray(data.data) ? data.data : [];
      all = all.concat(items);
      hasMore = !!(data && data.has_more && items.length);
      after = items.length ? items[items.length-1].id : null;
      page++;
    }
    state.messages = all.map(m=>({ id:m.id, from:m.from||"", to:m.to||[], subject:m.subject||"(tanpa subjek)", created_at:m.created_at, attachments:m.attachments||[], snippet:"", _raw:m }));
    state.lastSync = new Date().toISOString();
    render();
    let fetched=0;
    for(const m of state.messages){
      if(fetched>=20) break;
      try{ const full = await resend("GET","/emails/receiving/"+encodeURIComponent(m.id)); m.snippet = snippetFrom(full.text, full.html); fetched++; if(state.tab==="inbox") renderListOnly(); }catch(e){}
    }
  }catch(e){ state.error = e.message||"Gagal memuat kotak masuk."; }
  state.loading=false; render();
}
async function openMessage(id){
  state.openId=id; state.detail=null; state.detailLoading=true; render();
  readFlags[id]=true; saveRead();
  try{ const full = await resend("GET","/emails/receiving/"+encodeURIComponent(id)); state.detail=full; }
  catch(e){ state.detail={ _error:e.message||"Gagal memuat isi email." }; }
  state.detailLoading=false; render();
}
async function downloadAttachment(emailId, attId, filename){
  try{
    toast("Menyiapkan lampiran…");
    const meta = await resend("GET","/emails/receiving/"+encodeURIComponent(emailId)+"/attachments/"+encodeURIComponent(attId));
    if(!meta || !meta.download_url) throw new Error("Resend tidak memberikan link unduhan untuk lampiran ini.");
    const a=document.createElement("a"); a.href=meta.download_url; a.download=meta.filename||filename||"lampiran"; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast(e.message||"Gagal mengunduh lampiran."); }
}
async function sendCurrentCompose(){
  const c=state.compose; if(!c) return;
  const identity = identities.find(i=>i.email===c.fromEmail) || identities[0];
  if(!identity) throw new Error("Belum ada nama pengirim. Tambahkan dulu di Pengaturan.");
  const to=splitAddresses(c.to), cc=splitAddresses(c.cc), bcc=splitAddresses(c.bcc);
  if(!to.length) throw new Error("Isi minimal satu alamat tujuan.");
  if(!c.body.trim()) throw new Error("Isi email masih kosong.");
  const headers={}; if(c.inReplyTo){ headers["In-Reply-To"]=c.inReplyTo; headers["References"]=c.references||c.inReplyTo; }
  const payload={ from: identity.name? (identity.name+" <"+identity.email+">") : identity.email, to:to, subject:c.subject||"(tanpa subjek)", text:c.body, html:textToHtml(c.body) };
  if(cc.length) payload.cc=cc; if(bcc.length) payload.bcc=bcc; if(Object.keys(headers).length) payload.headers=headers;
  const data = await resend("POST","/emails",{body:payload});
  sentLocal.unshift({ id: data&&data.id?data.id:("local-"+Date.now()), from:identity.email, to:to, subject:payload.subject, body_text:c.body, created_at:new Date().toISOString() });
  saveSent();
  state.compose=null; state.tab="sent"; render(); toast("Email terkirim.");
}
/* Perbarui otomatis tiap 2 menit selama file ini terbuka & tab Kotak Masuk aktif */

function genGuestAddress(){

}

function computeAddresses(){
  const map={};
  identities.forEach(i=>{ const e=(i.email||"").toLowerCase(); if(e) map[e]={email:e,name:i.name||"",registered:true,count:0,last:null,sent:0}; });
  state.messages.forEach(m=>{ (m.to||[]).forEach(raw=>{ const e=parseAddress(raw).email.toLowerCase(); if(!e || !e.endsWith("@"+cfg.domain.toLowerCase())) return; if(!map[e]) map[e]={email:e,name:"",registered:false,count:0,last:null,sent:0}; map[e].count++; if(!map[e].last || m.created_at>map[e].last) map[e].last=m.created_at; }); });
  sentLocal.forEach(s=>{ const e=(s.from||"").toLowerCase(); if(map[e]) map[e].sent++; });
  const list=Object.values(map);
  list.sort((a,b)=> (b.registered-a.registered) || (b.count-a.count) || (b.sent-a.sent) || (a.email<b.email?-1:1));
  return list;
}

function validLocalpart(name){ return /^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$/.test(name); }
function createAddress(){
  const inp=document.getElementById("a-name"); const err=document.getElementById("addr-error");
  const name=(inp.value||"").trim().toLowerCase();
  if(err) err.textContent="";
  if(!name){ if(err) err.textContent="Isi dulu nama alamatnya."; return; }
  if(!validLocalpart(name)){ if(err) err.textContent="Nama tidak valid. Pakai huruf kecil, angka, titik, strip, underscore — diawali dan diakhiri huruf/angka."; return; }
  const email=name+"@"+cfg.domain.toLowerCase();
  if(identities.some(i=>i.email.toLowerCase()===email)){ if(err) err.textContent=email+" sudah terdaftar."; return; }
  const disp=name.charAt(0).toUpperCase()+name.slice(1);
  identities.push({id:Date.now(), name:disp, email:email}); saveIdent();
  state.activeAddress=email; LS.set("active_address", email); state.search=""; state.tab="inbox"; render(); toast(email+" dibuat & langsung aktif — inbox sudah pindah ke alamat ini.");
}
function registerAddress(email){
  email=(email||"").toLowerCase();
  if(identities.some(i=>i.email.toLowerCase()===email)){ toast(email+" sudah terdaftar."); return; }
  const local=email.split("@")[0];
  const disp=local.charAt(0).toUpperCase()+local.slice(1);
  identities.push({id:Date.now(), name:disp, email:email}); saveIdent(); render(); toast(email+" didaftarkan sebagai pengirim.");
}
function copyAddress(email){
  const done=()=>toast(email+" disalin.");
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(email).then(done).catch(()=>fallbackCopy(email, done)); }
  else fallbackCopy(email, done);
}
function fallbackCopy(text, done){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast(text); } ta.remove(); }

function startReply(all){ const m=state.detail; if(!m) return; const sender=parseAddress((m.reply_to&&m.reply_to[0])||m.from||""); let cc=[]; if(all){ const mine=new Set(identities.map(i=>i.email.toLowerCase())); const pool=[...(m.to||[]),...(m.cc||[])].map(a=>parseAddress(a).email).filter(e=>e.toLowerCase()!==sender.email.toLowerCase()&&!mine.has(e.toLowerCase())&&!e.toLowerCase().endsWith("@"+cfg.domain.toLowerCase())); cc=Array.from(new Set(pool)); } state.compose={ title:all?"Balas semua":"Balas email", fromEmail:(identities[0]||{}).email||"", to:sender.email, cc:cc.join(", "), bcc:"", subject:/^re:/i.test(m.subject||"")?m.subject:("Re: "+(m.subject||"")), body:quoteBlock(m), inReplyTo:m.message_id||undefined, references:m.message_id||undefined }; render(); }

  else if(state.tab==="sent") main=sentHtml();
  else main=settingsHtml();

  const pageTitle = needsSetup ? "Siapkan dulu, sebentar saja" : state.tab==="inbox" ? "Kotak Masuk" : state.tab==="sent" ? "Terkirim" : "Pengaturan";
  const pageSub = needsSetup ? "3 langkah, tanpa istilah teknis." : state.tab==="sent" ? "Hanya tersimpan di perangkat ini." : state.tab==="settings" ? "Koneksi, nama pengirim, dan info kuota." : (state.activeAddress ? esc(state.activeAddress) : "@"+esc(cfg.domain));

  app.innerHTML='<header class="header"><div class="header-in"><div class="brand"><span class="brand-mark">✉️</span><span><span class="brand-name">Terablox Mail</span><br><span class="brand-sub">@'+esc(cfg.domain)+'</span></span></div>'+statusPill()+'</div></header>'
    +'<div class="shell">'
    +(needsSetup?"":'<aside class="sidebar"><button class="side-btn" onclick="newCompose()">✎ &nbsp;Tulis email baru</button><div style="height:8px"></div><button class="side-btn '+(state.tab==="inbox"?"active":"")+'" onclick="goTab(\'inbox\')">📥 &nbsp;Kotak Masuk'+(unread?'<span class="count">'+unread+'</span>':"")+'</button><button class="side-btn '+(state.tab==="sent"?"active":"")+'" onclick="goTab(\'sent\')">➤ &nbsp;Terkirim</button><button class="side-btn '+(state.tab==="settings"?"active":"")+'" onclick="goTab(\'settings\')">⚙ &nbsp;Pengaturan</button><p class="side-note">Email ke alamat apa pun @'+esc(cfg.domain)+' otomatis masuk. Tidak perlu buat alamat satu-satu.</p></aside>')
    +'<main class="main"><div class="page-head"><h1>'+esc(pageTitle)+'</h1>'+(state.tab==="inbox"&&unreadShown&&!needsSetup?'<span class="chip chip-accent">'+unreadShown+" belum dibaca</span>":"")+'<span class="spacer"></span><span class="small">'+esc(pageSub)+'</span></div>'
    + main + "</main></div>"
    +(needsSetup?"":'<button class="fab" onclick="newCompose()">✎ Tulis</button>')
    +(needsSetup?"":'<nav class="bottomnav"><button class="'+(state.tab==="inbox"?"active":"")+'" onclick="goTab(\'inbox\')">📥<br>Kotak Masuk'+(unread?" ("+unread+")":"")+'</button><button class="'+(state.tab==="sent"?"active":"")+'" onclick="goTab(\'sent\')">➤<br>Terkirim</button><button class="'+(state.tab==="settings"?"active":"")+'" onclick="goTab(\'settings\')">⚙<br>Pengaturan</button></nav>')
    + readHtml() + composeHtml();
  renderToast();
}
/* Init */
if(configured()){ state.mode="owner"; }
else if(state.guestAddress){ state.mode="guest"; }
else { state.mode="landing"; }
if(!configured()){ state.setupStep=1; }
else if(!identities.length){ state.setupStep=2; }
render();
if(configured()) loadInbox();
if(state.mode==="guest" && state.guestAddress) loadGuestInbox();
</script>
</body>
</html>
