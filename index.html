<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TheMail — @terablox.store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* TheMail v11 — auto-save drafts (new key tbm_draft; text fields only, attachments not saved).
   Single file, no server, no external fonts. All Resend calls go through your Worker.
   The Resend API key NEVER lives in this file. What is stored in this browser's localStorage:
   Worker URL + password, sender names, locally sent mail, read marks, draft of the last unsent email. */
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --text:#0f172a; --dim:#64748b;
  --border:#e2e8f0; --accent:#2563eb; --accent-strong:#1d4ed8; --accent-soft:#eff6ff;
  --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2; --warn:#d97706;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.05);
}
[data-theme="dark"]{
  --bg:#0f172a; --surface:#1e293b; --surface-2:#334155; --text:#f1f5f9; --dim:#94a3b8;
  --border:#334155; --accent:#60a5fa; --accent-strong:#93c5fd; --accent-soft:#1e3a5f;
  --ok:#4ade80; --ok-soft:#14532d; --bad:#f87171; --bad-soft:#450a0a; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
[data-theme="dark"] .header{background:rgba(15,23,42,.92)}
[data-theme="dark"] .side-btn:hover{background:#334155}
[data-theme="dark"] .progress{background:#334155}
[data-theme="dark"] details.help code{background:#334155}
[data-theme="dark"] .toast{background:#f1f5f9;color:#0f172a}
.theme-btn{width:40px;height:40px;flex:0 0 40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px}
.att-img{max-width:100%;height:auto;border-radius:10px;margin-top:8px;display:block}
.att-prev{margin-top:8px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.ic{width:18px;height:18px;flex:0 0 18px;vertical-align:-3px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer} input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- Header: brand + connection status (always visible) ---------- */
.header{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.brand-mark svg{width:23px;height:23px}
.controls-card{padding:14px 16px;margin-bottom:12px}
.controls-card .toolbar{margin-bottom:0}
.ctl-note{margin:10px 2px 0;font-size:12.5px;color:var(--dim)}
.brand-name{font-weight:700;font-size:16px;line-height:1.2;white-space:nowrap;letter-spacing:-.01em}
.brand-sub{font-size:12.5px;color:var(--dim);white-space:nowrap}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.status.on{color:var(--ok)} .status.on .dot{background:var(--ok)}
.status.off{color:var(--warn)} .status.off .dot{background:var(--warn)}

/* ---------- Layout: sidebar on desktop, centered content ---------- */
.shell{max-width:1080px;margin:0 auto;padding:20px 16px 120px;display:flex;gap:24px;align-items:flex-start}
.sidebar{flex:0 0 210px;position:sticky;top:82px;display:none}
@media(min-width:900px){ .sidebar{display:block} .main{flex:1;min-width:0} }
.main{flex:1;min-width:0;max-width:760px;margin:0 auto;width:100%}
@media(min-width:900px){ .main{margin:0} }
.side-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--text)}
.side-btn:hover{background:var(--surface-2)}
.side-btn.active{background:var(--accent-soft);font-weight:600;color:var(--accent-strong)}
.side-btn .count{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.side-note{font-size:12.5px;color:var(--dim);line-height:1.6;padding:12px 14px}

/* ---------- Cards, buttons, forms ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
h1{font-size:20px;margin:0;letter-spacing:-.01em} h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em} h3{font-size:15px;margin:0}
.muted{color:var(--dim);font-size:14px;line-height:1.6}
.small{font-size:13px;color:var(--dim);line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;text-decoration:none}
.btn:hover{border-color:#cbd5e1}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong)}
.btn:disabled{opacity:.55;cursor:default}
.btn-block{width:100%}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;min-height:48px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--surface);outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface);outline:0;resize:vertical;line-height:1.6}
.hint{font-size:13px;color:var(--dim);line-height:1.6;margin-top:6px}
.err{color:var(--bad);font-size:14px;line-height:1.5}
.oktxt{color:var(--ok);font-size:14px;line-height:1.5;font-weight:600}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;min-width:0}
.icon-btn{width:44px;height:44px;flex:0 0 44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px}
details.help{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface-2);margin-top:14px}
details.help summary{cursor:pointer;font-weight:600;font-size:14px}
details.help ol{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.7;color:var(--text)}
details.help code{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:13px}

/* ---------- Wizard steps ---------- */
.steps{display:flex;gap:6px;margin:0 0 18px}
.step{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--dim);line-height:1.35}
.step .num{display:inline-flex;width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:var(--surface);align-items:center;justify-content:center;font-weight:700;font-size:12.5px;margin-bottom:6px}
.step.done{color:var(--ok)} .step.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now{color:var(--accent-strong)} .step.now .num{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- Inbox ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 14px;height:48px;min-width:0}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0}
@media(max-width:899px){ .toolbar{flex-wrap:wrap} .search{flex:1 1 100%} }
.list{list-style:none;margin:0;padding:0;overflow:hidden}
.list li{border-bottom:1px solid var(--border)} .list li:last-child{border-bottom:0}
.mail-row{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 16px;align-items:flex-start}
.mail-row:hover{background:var(--surface-2)}
.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.row-main{flex:1;min-width:0}
.row-top{display:flex;gap:8px;align-items:baseline}
.row-from{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.row-date{flex:0 0 auto;font-size:12px;color:var(--dim)}
.unread .row-from{font-weight:700} .unread .row-date{color:var(--accent);font-weight:600}
.row-subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;display:block}
.unread .row-subj{font-weight:600}
.row-snip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--accent);display:inline-block;flex:0 0 8px;margin-top:5px}
.empty{text-align:center;padding:52px 18px;color:var(--dim);line-height:1.65}
.empty b{color:var(--text);display:block;font-size:16px;margin-bottom:6px}
.page-head{display:flex;align-items:baseline;gap:10px;margin:2px 2px 14px;flex-wrap:wrap}
.page-head .spacer{flex:1}
.chip{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;background:var(--surface);white-space:nowrap}
.chip-accent{color:var(--accent-strong);background:var(--accent-soft);border-color:transparent}

/* ---------- Read email & compose ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.overlay-inner{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.overlay-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;z-index:2}
.email-body{font-size:15.5px;line-height:1.7;word-break:break-word}
.email-body img{max-width:100%;height:auto}
pre.plain{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15.5px;line-height:1.7}
.attach{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.fab{position:fixed;right:16px;bottom:96px;z-index:30;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(15,23,42,.18);font-size:14.5px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;border:0;background:none;padding:8px 4px;font-size:12px;color:var(--dim);border-radius:10px}
.bottomnav button.active{color:var(--accent-strong);font-weight:700;background:var(--accent-soft)}
@media(min-width:900px){ .bottomnav{display:none} .fab{bottom:24px;right:24px} .shell{padding-bottom:40px} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:60;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.25)}
@media(min-width:900px){ .toast{bottom:32px} }
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.section-card{margin-bottom:16px}
.kv{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:9px 0;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 130px;font-weight:600}
</style>

<body>
<div id="app"></div>
<div id="toast-root"></div>
<script>
"use strict";
/* Lapisan data — sama seperti v1, kunci localStorage TIDAK berubah (tbm_*)
   supaya pengaturan lama kamu langsung kebawa ke v2. */
/* ALAMAT WORKER PUBLIK — isi sebelum file ini di-host untuk umum.
   Ini BUKAN rahasia: tamu hanya bisa memakai rute publik (alamat tmp- saja,
   hanya baca — lihat worker.js). Kata sandi pemilik TIDAK PERNAH ditulis di sini.
   Contoh: "https://terablox-mail-proxy.akunmu.workers.dev"
   Biarkan "" kalau file ini hanya untuk pemakaian pribadi (mode Tamu akan
   memberitahu pengunjung bahwa mode tamu belum diaktifkan). */
const PUBLIC_WORKER_URL = "https://mail-terablox.lazulias00.workers.dev";
/* BOOT_MODE — "guest" = halaman utama (langsung mode Tamu, tanpa login Pemilik).
   "owner" = halaman /admin (langsung mode Pemilik / wizard). File admin.html
   adalah salinan file ini dengan nilai ini diganti "owner". */
const BOOT_MODE = "guest";
const LS = {
  get(k, fb){ try{ const v = localStorage.getItem("tbm_"+k); return v===null?fb:JSON.parse(v); }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem("tbm_"+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("tbm_"+k); }catch(e){} }
};
let cfg = {
  proxyUrl: LS.get("proxy_url",""),
  proxyPassword: LS.get("proxy_password",""),
  domain: LS.get("domain","terablox.store")
};
let identities = LS.get("identities", []);
let sentLocal = LS.get("sent", []);
let readFlags = LS.get("read", {});
let state = { tab:"inbox", search:"", messages:[], loading:false, error:null, openId:null, detail:null, detailLoading:false, compose:null, toast:null, setupStep:1, lastSync:null, showPass:false, activeAddress: LS.get("active_address","")||"", addrManageOpen:false, mode:BOOT_MODE, guestAddress: LS.get("guest_address","")||"", guestCreated: LS.get("guest_created",[])||[], guestMessages:[], guestLoading:false, guestError:null, guestOpenId:null, guestDetail:null, guestDetailLoading:false, unreadOnly:false, theme:LS.get("theme","light"), notifyEnabled:LS.get("notify_enabled",false), attPreviewUrls:{} };
function saveCfg(){ LS.set("proxy_url",cfg.proxyUrl); LS.set("proxy_password",cfg.proxyPassword); LS.set("domain",cfg.domain); }
function saveIdent(){ LS.set("identities",identities); }
function saveSent(){ LS.set("sent",sentLocal); }
function saveRead(){ LS.set("read",readFlags); }
function configured(){ return cfg.proxyUrl.trim().length>0 && cfg.proxyPassword.length>0; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseAddress(raw){ const m=String(raw||"").match(/^\s*(.*?)\s*<([^>]+)>\s*$/); if(m) return {name:m[1].replace(/^"|"$/g,""), email:m[2].trim()}; return {name:"", email:String(raw||"").trim()}; }
function displaySender(raw){ const p=parseAddress(raw); return p.name||p.email||"(unknown)"; }
function initialsOf(raw){ const l=displaySender(raw); if(l.includes("@")){ const local=l.split("@")[0]; const s=local.split(/[._-]+/).filter(Boolean); return (s.length>1?(s[0][0]+s[1][0]):local.slice(0,2)).toUpperCase(); } const p=l.split(/\s+/).filter(Boolean); return (p.length>1?(p[0][0]+p[1][0]):l.slice(0,2)).toUpperCase(); }
function fmtListDate(iso){ const d=new Date(iso), n=new Date(); if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}); const y=new Date(n); y.setDate(n.getDate()-1); if(d.toDateString()===y.toDateString()) return "Yesterday"; if(d.getFullYear()===n.getFullYear()) return d.toLocaleDateString("en-US",{day:"numeric",month:"short"}); return d.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"}); }
function fmtFullDate(iso){ return new Date(iso).toLocaleString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function fmtSize(b){ if(!b&&b!==0) return ""; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
function splitAddresses(v){ return String(v||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean); }
function snippetFrom(text, html){ let s=text||""; if(!s&&html) s=html.replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<[^>]+>/g," "); return s.replace(/\s+/g," ").trim().slice(0,180); }
function textToHtml(text){ const e=esc(text); return e.split(/\n{2,}/).map(p=>"<p>"+p.replace(/\n/g,"<br>")+"</p>").join(""); }
function sanitizeHtml(html){ const doc=new DOMParser().parseFromString(html,"text/html"); doc.querySelectorAll("script,style,iframe,object,embed,form,link,meta,title,noscript,base").forEach(el=>el.remove()); doc.querySelectorAll("*").forEach(el=>{ for(const a of Array.from(el.attributes)){ const n=a.name.toLowerCase(); if(n.startsWith("on")||n==="srcdoc"||n==="formaction") el.removeAttribute(a.name); else if((n==="href"||n==="src"||n==="xlink:href")&&/^\s*(javascript|vbscript|data:text\/html)/i.test(a.value)) el.removeAttribute(a.name); } if(el.tagName==="A"){ el.setAttribute("target","_blank"); el.setAttribute("rel","noopener noreferrer"); } if(el.tagName==="IMG"){ el.setAttribute("style",(el.getAttribute("style")||"")+";max-width:100%;height:auto"); } }); return doc.body.innerHTML; }
function toast(msg){ state.toast=msg; renderToast(); setTimeout(()=>{ state.toast=null; renderToast(); },3600); }
function renderToast(){ updateTitleBadge(); document.getElementById("toast-root").innerHTML = state.toast? '<div class="toast">'+esc(state.toast)+"</div>":""; }
function updateTitleBadge(){
  if(typeof unreadCount!=="function") return;
  const n = state.mode==="guest" ? 0 : unreadCount();
  document.title = n>0 ? "("+n+") TheMail — @terablox.store" : "TheMail — @terablox.store";
}
function announceNewMail(prevIds, list, label){
  if(!prevIds || !prevIds.size) return;
  const fresh=list.filter(m=>!prevIds.has(m.id));
  if(!fresh.length) return;
  const n=fresh.length;
  const msg=(n===1?"1 new email":n+" new emails")+(label?" — "+label:"");
  toast(msg);
  if(state.notifyEnabled && document.hidden && "Notification" in window && Notification.permission==="granted"){
    try{ new Notification("TheMail",{body:msg+"\n"+fresh.slice(0,3).map(m=>displaySender(m.from)+": "+(m.subject||"(no subject)")).join("\n")}); }catch(e){}
  }
}
</script>
<script>
"use strict";
/* ===== Lapisan proxy: SATU-SATUNYA jalan ke Resend (kontrak worker.js tidak berubah) ===== */
function friendlyResendError(status, data){
  const msg = data && data.message ? data.message : "";
  if(status===401) return "Password / API key mismatch. Check the password in your Worker.";
  if(status===403) return "The Resend API key has no read permission. Make sure it was created with Full access in the Resend dashboard.";
  if(status===429) return "The free Resend quota is used up (100 emails/day, 3,000/month). Try again tomorrow.";
  if(status===422) return "Resend rejected this email: "+(msg||"the address or content is invalid.");
  return msg || ("Resend returned an error ("+status+").");
}
async function proxyFetch(pathSuffix, options){
  const base = cfg.proxyUrl.trim().replace(/\/+$/,"");
  if(!base) throw new Error("The Worker URL is not set yet. Please complete step 1 first.");
  let res;
  try{ res = await fetch(base+pathSuffix, options); }
  catch(e){ throw new Error("Could not reach the Worker. Check its URL and your internet connection."); }
  const json = await res.json().catch(()=>null);
  if(!res.ok){ throw new Error((json && json.error) || ("The Worker returned an error ("+res.status+").")); }
  return json;
}
async function resend(method, path, opts){
  opts = opts||{};
  const json = await proxyFetch("/api/resend", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "X-Proxy-Password": cfg.proxyPassword },
    body: JSON.stringify({ method:method, path:path, query:opts.query||"", body:opts.body })
  });
  const status = json && typeof json.status==="number" ? json.status : 200;
  const data = json ? json.data : null;
  if(status<200 || status>=300) throw new Error(friendlyResendError(status, data));
  return data;
}
async function testConnection(){
  await proxyFetch("/api/health", { method:"GET", headers:{ "X-Proxy-Password": cfg.proxyPassword } });
  const data = await resend("GET","/emails/receiving",{query:"limit=1"});
  return data && Array.isArray(data.data) ? data.data.length : 0;
}
/* ===== Data ===== */
async function loadInbox(){
  if(!configured()){ state.messages=[]; return; }
  state.loading=true; state.error=null; render();
  try{
    let all=[], after=null, hasMore=true, page=0;
    while(hasMore && page<5){
      const q = new URLSearchParams({limit:"100"}); if(after) q.set("after",after);
      const data = await resend("GET","/emails/receiving",{query:q.toString()});
      const items = data && Array.isArray(data.data) ? data.data : [];
      all = all.concat(items);
      hasMore = !!(data && data.has_more && items.length);
      after = items.length ? items[items.length-1].id : null;
      page++;
    }
    const prevIds = new Set(state.messages.map(m=>m.id));
    state.messages = all.map(m=>({ id:m.id, from:m.from||"", to:m.to||[], subject:m.subject||"(no subject)", created_at:m.created_at, attachments:m.attachments||[], snippet:"", _raw:m }));
    announceNewMail(prevIds, state.messages);
    state.lastSync = new Date().toISOString();
    render();
    let fetched=0;
    for(const m of state.messages){
      if(fetched>=20) break;
      try{ const full = await resend("GET","/emails/receiving/"+encodeURIComponent(m.id)); m.snippet = snippetFrom(full.text, full.html); fetched++; if(state.tab==="inbox") renderListOnly(); }catch(e){}
    }
  }catch(e){ state.error = e.message||"Failed to load the inbox."; }

}

  }catch(e){ toast(e.message||"Failed to download the attachment."); }
}

async function sendCurrentCompose(){

  const to=splitAddresses(c.to), cc=splitAddresses(c.cc), bcc=splitAddresses(c.bcc);
  if(!to.length) throw new Error("Enter at least one recipient address.");
  if(!c.body.trim()) throw new Error("The email body is empty.");
  const headers={}; if(c.inReplyTo){ headers["In-Reply-To"]=c.inReplyTo; headers["References"]=c.references||c.inReplyTo; }
  const payload={ from: identity.name? (identity.name+" <"+identity.email+">") : identity.email, to:to, subject:c.subject||"(no subject)", text:c.body, html:textToHtml(c.body) };
  if(c.attachments && c.attachments.length) payload.attachments=c.attachments.map(a=>({ filename:a.filename, content:a.content, content_type:a.content_type }));
  if(cc.length) payload.cc=cc; if(bcc.length) payload.bcc=bcc; if(Object.keys(headers).length) payload.headers=headers;

async function mintGuestAddress(){
  const base=guestBase(); if(!base) return { ok:false, error:"Guest mode is not enabled on this site." };

  try{
    res=await fetch(base+"/api/public/create-address", { method:"POST" });
    json=await res.json().catch(()=>null);
  }catch(e){ return { ok:false, error:"Could not reach the Worker — check your connection and try again." }; }
  if(!res.ok) return { ok:false, error:(json && json.error) || "Could not create a temporary address." };

function computeAddresses(){

  sentLocal.forEach(s=>{ const e=(s.from||"").toLowerCase(); if(map[e]) map[e].sent++; });

function validLocalpart(name){ return /^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$/.test(name); }
function createAddress(){

  const opts=identities.map(i=>'<option value="'+esc(i.email)+'"'+(i.email===c.fromEmail?" selected":"")+">"+esc(i.name)+" &lt;"+esc(i.email)+"&gt;</option>").join("");
  return '<div class="overlay"><div class="overlay-inner"><div class="overlay-head"><button class="icon-btn" onclick="closeCompose()">'+ic('x')+'</button><h2 style="flex:1">'+esc(c.title)+'</h2><button class="btn btn-primary" id="send-btn" onclick="doSend()">'+ic('send')+' Send</button></div>'
    +(c._draftRestored?'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 2px 0"><span class="small">Draft restored — last saved '+esc(new Date(c._draftSavedAt||Date.now()).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}))+' (attachments are not saved in drafts)</span><button class="btn" style="min-height:30px;padding:2px 10px" onclick="discardDraft()">Discard draft</button></div>':'')
    +'<div class="card card-pad">'
    +'<div class="field"><label for="c-from">Send as</label><select id="c-from" onchange="updCompose(\'fromEmail\',this.value)">'+opts+'</select></div>'
    +'<div class="field"><label for="c-to">To</label><input id="c-to" type="text" placeholder="name@email.com — separate with commas if more than one" value="'+esc(c.to)+'" oninput="updCompose(\'to\',this.value)"></div>'
    +'<div class="field"><label for="c-cc">Cc <span style="font-weight:400;color:var(--dim)">(optional)</span></label><input id="c-cc" type="text" value="'+esc(c.cc)+'" oninput="updCompose(\'cc\',this.value)"></div>'
    +'<div class="field"><label for="c-bcc">Bcc <span style="font-weight:400;color:var(--dim)">(optional)</span></label><input id="c-bcc" type="text" value="'+esc(c.bcc)+'" oninput="updCompose(\'bcc\',this.value)"></div>'
    +'<div class="field"><label for="c-subj">Subject</label><input id="c-subj" type="text" value="'+esc(c.subject)+'" oninput="updCompose(\'subject\',this.value)"></div>'
    +'<div class="field"><label for="c-body">Email body</label><textarea id="c-body" rows="14" placeholder="Write your email here…" oninput="updCompose(\'body\',this.value)">'+esc(c.body)+'</textarea></div>'
    +'<div class="field"><label>Attachments <span style="font-weight:400;color:var(--dim)">(optional, max 10 MB total)</span></label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" onclick="document.getElementById(\'c-files\').click()">'+ic('paperclip')+' Attach files</button><span class="small" id="att-summary"></span></div><input id="c-files" type="file" multiple style="display:none" onchange="onAttachFiles(this)"><div id="att-list" style="margin-top:8px"></div></div>'
    +'<p class="err" id="compose-error"></p></div></div></div>';
}
function updCompose(k,v){ if(state.compose) state.compose[k]=v; saveDraft(); }
let _draftTimer=null;
function saveDraft(){ if(!state.compose) return; clearTimeout(_draftTimer); _draftTimer=setTimeout(()=>{ const c=state.compose; if(!c) return; const d={fromEmail:c.fromEmail,to:c.to||"",cc:c.cc||"",bcc:c.bcc||"",subject:c.subject||"",body:c.body||"",updated_at:Date.now()}; if(!d.to&&!d.cc&&!d.bcc&&!d.subject&&!d.body){ LS.del("draft"); } else { LS.set("draft",d); } },500); }
function loadDraft(){ return LS.get("draft",null); }
function discardDraft(){ LS.del("draft"); if(state.compose){ state.compose.to=""; state.compose.cc=""; state.compose.bcc=""; state.compose.subject=""; state.compose.body=""; state.compose._draftRestored=false; } render(); }
function closeCompose(){ state.compose=null; render(); }
const MAX_ATTACH_TOTAL = 10*1024*1024;
function onAttachFiles(input){
  const files = input && input.files ? Array.from(input.files) : [];
  if(!state.compose || !files.length) return;
  const c = state.compose;
  c.attachments = c.attachments || [];
  let total = c.attachments.reduce((s,a)=>s+(a.size||0),0);
  let skipped = 0, pending = 0;
  const btn=document.getElementById("send-btn");
  files.forEach(f=>{
    if(total + f.size > MAX_ATTACH_TOTAL){ skipped++; return; }
    total += f.size; pending++;
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = String(reader.result||"");
      const content = dataUrl.includes(",") ? dataUrl.split(",")[1] : dataUrl;
      c.attachments.push({ filename:f.name, content_type:f.type||"application/octet-stream", size:f.size, content:content });
      c._attPending=(c._attPending||0)-1; renderAttList();
      if((c._attPending||0)<=0 && btn) btn.disabled=false;
    };
    reader.onerror = ()=>{ c._attPending=(c._attPending||0)-1; if((c._attPending||0)<=0 && btn) btn.disabled=false; };
    c._attPending=(c._attPending||0)+1;
    reader.readAsDataURL(f);
  });
  if(pending && btn) btn.disabled=true;
  if(skipped) toast("Some files were skipped — attachments are limited to 10 MB total.");
  input.value = "";
}
function renderAttList(){
  const el=document.getElementById("att-list"); if(!el || !state.compose) return;
  const atts=state.compose.attachments||[];
  el.innerHTML = atts.map((a,i)=>'<span class="chip" style="margin:0 6px 6px 0">'+esc(a.filename)+' ('+esc(fmtSize(a.size))+') <button type="button" onclick="removeAttachment('+i+')" style="border:0;background:none;cursor:pointer;font-weight:800" aria-label="Remove attachment">'+ic('x',14)+'</button></span>').join("") || '<span class="small">No files attached yet.</span>';
  const sum=document.getElementById("att-summary"); if(sum) sum.textContent = atts.length ? (atts.length+" file"+(atts.length>1?"s":"")+" · "+fmtSize(atts.reduce((s,a)=>s+(a.size||0),0))+" total") : "";
}
function removeAttachment(i){ if(!state.compose || !state.compose.attachments) return; state.compose.attachments.splice(i,1); renderAttList(); }
async function doSend(){ const btn=document.getElementById("send-btn"); const errEl=document.getElementById("compose-error"); if(state.compose && (state.compose._attPending||0)>0){ if(errEl) errEl.textContent="Still reading attached files — please wait a moment."; return; } if(btn){btn.disabled=true; btn.innerHTML="Sending…";} if(errEl) errEl.textContent=""; try{ await sendCurrentCompose(); }catch(e){ if(errEl) errEl.textContent=e.message||"Failed to send email."; if(btn){btn.disabled=false; btn.innerHTML=ic('send')+" Send";} } }
function newCompose(){ const d=loadDraft(); const defFrom=(identities.find(i=>i.email.toLowerCase()===(state.activeAddress||"").toLowerCase())||identities[0]||{}).email||""; state.compose={ title:"New email", fromEmail:(d&&d.fromEmail&&identities.some(i=>i.email===d.fromEmail))?d.fromEmail:defFrom, to:d?d.to||"":"", cc:d?d.cc||"":"", bcc:d?d.bcc||"":"", subject:d?d.subject||"":"", body:d?d.body||"":"", attachments:[], _draftRestored:!!d, _draftSavedAt:d?d.updated_at:0 }; render(); }

/* ===== Settings v2: 3 kartu terpisah, bukan satu form panjang ===== */
function settingsHtml(){
  return '<div class="card card-pad section-card"><h2>Connection</h2><p class="muted">This webmail connects through your own Cloudflare Worker. Your Resend API key lives in the Worker, not in this file.</p>'
    +'<div class="field" style="margin-top:14px"><label for="s-url">Your Worker URL</label><input id="s-url" type="url" placeholder="https://your-worker-name.workers.dev" value="'+esc(cfg.proxyUrl)+'"><p class="hint">It ends with <b>.workers.dev</b> — it appears after you deploy worker.js on Cloudflare.</p></div>'
    +'<div class="field"><label for="s-pass">Worker password</label><div class="input-row"><input id="s-pass" type="'+(state.showPass?"text":"password")+'" placeholder="Exactly as you set it in the Worker" value="'+esc(cfg.proxyPassword)+'"><button class="icon-btn" type="button" onclick="togglePass()">'+(state.showPass?ic('eye-off'):ic('eye'))+'</button></div><p class="hint">Do not share this URL + password with anyone — anyone who knows both can read &amp; send mail as you.</p></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="saveSettings()">Save</button><button class="btn" id="test-btn" onclick="doTest()">Test connection</button></div>'
    +'<p id="settings-msg" style="margin-top:10px"></p>'
    +'<p class="hint">Status: '+(configured()?'<span style="color:var(--ok);font-weight:700">Already filled in — press Test connection to verify</span>':'<span style="color:var(--warn);font-weight:700">Not filled in yet</span>')+'</p></div>'
    +'<div class="card card-pad section-card"><h2>Sender name</h2><p class="muted">Any @'+esc(cfg.domain)+' address can receive mail automatically. This list is only the names + addresses shown when you send.</p>'
    +(identities.length? '<div class="card" style="margin-top:12px"><ul class="list">'+identities.map(i=>'<li><div style="display:flex;gap:12px;align-items:center;padding:12px 16px"><span class="avatar">'+esc(initialsOf(i.email))+'</span><span style="flex:1;min-width:0"><span style="display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(i.name)+'</span><span style="font-family:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--dim)">'+esc(i.email)+'</span></span><button class="btn" style="min-height:40px;color:var(--bad)" onclick="removeIdentity(\''+esc(i.email)+'\')">Delete</button></div></li>').join("")+"</ul></div>":"<p class=\"muted\" style=\"margin-top:12px\">No sender name yet.</p>")
    +'<div class="field" style="margin-top:14px"><label for="i-name">Display name</label><input id="i-name" type="text" placeholder="e.g. Terablox"></div>'
    +'<div class="field"><label for="i-email">Email address</label><input id="i-email" type="text" placeholder="hello@'+esc(cfg.domain)+'"></div>'
    +'<p class="err" id="identity-error"></p><button class="btn" onclick="addIdentity()">Add sender name</button></div>'
    +'<div class="card card-pad section-card"><h2>About &amp; quota</h2>'
    +'<div class="kv"><b>Domain</b><span>@'+esc(cfg.domain)+'</span></div>'
    +'<div class="kv"><b>Resend quota</b><span>3,000 emails/month, max 100/day (free plan)</span></div>'
    +'<div class="kv"><b>Refreshing</b><span>Automatic every 2 minutes while this file is open. No background sync when the file is closed.</span></div>'
    +'<div class="kv"><b>New mail alerts</b><span>'+(state.notifyEnabled?"On — you will be notified when new mail arrives.":"Off.")+' <button class="btn" style="min-height:38px;margin-top:6px" onclick="toggleNotify()">'+(state.notifyEnabled?"Turn off":"Turn on")+'</button><br><span class="small">Shows a message here and, if you allow it, a browser notification when new mail arrives while this page is open.</span></span></div>'
    +'<div class="kv"><b>Stored data</b><span>Only in this browser (localStorage). Switching browsers means setting up the connection &amp; sender names again.</span></div>'
    +'<div style="margin-top:14px"><button class="btn" style="color:var(--bad)" onclick="disconnect()">Disconnect</button></div></div>'
    +'<div class="card card-pad section-card"><h2>Public mode &amp; security</h2><p class="muted">This file is safe to host publicly: no API key, password, or real Worker URL is written in it. Guests can only use a temporary address <b>tmp-xxxxxxxxxx@'+esc(cfg.domain)+'</b> (read-only, via the Worker public routes) and never see the owner inbox, addresses, or settings.</p><p class="muted" style="margin-top:8px">If this file is opened on a shared / public device, lock it or delete your data when done:</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" onclick="lockOwner()">'+ic('lock')+' Lock (back to the guest page)</button><button class="btn" style="color:var(--bad)" onclick="wipeAllData()">'+ic('trash')+' Delete all data on this device</button></div><p class="hint" style="margin-top:10px">Turn guest mode off any time from the Worker: set <b>PUBLIC_ENABLED=false</b> then Deploy — owner mode keeps working.</p></div>';
}
function saveSettings(){ cfg.proxyUrl=document.getElementById("s-url").value.trim(); cfg.proxyPassword=document.getElementById("s-pass").value; saveCfg(); const m=document.getElementById("settings-msg"); if(m) m.innerHTML='<span class="oktxt">Saved in this browser.</span>'; if(configured()) loadInbox(); }
async function doTest(){ saveSettingsSilent(); const btn=document.getElementById("test-btn"); const m=document.getElementById("settings-msg"); if(btn){btn.disabled=true; btn.textContent="Testing…";} if(m) m.textContent=""; try{ await testConnection(); if(m) m.innerHTML='<span class="oktxt">Connection successful — the Worker is live and the Resend API key is valid.</span>'; loadInbox(); }catch(e){ if(m) m.innerHTML='<span class="err">'+esc(e.message||"Connection failed.")+"</span>"; } if(btn){btn.disabled=false; btn.textContent="Test connection";} }
function saveSettingsSilent(){ const u=document.getElementById("s-url"), p=document.getElementById("s-pass"); if(u) cfg.proxyUrl=u.value.trim(); if(p) cfg.proxyPassword=p.value; saveCfg(); }
function addIdentity(){ const name=document.getElementById("i-name").value.trim(); const email=document.getElementById("i-email").value.trim().toLowerCase(); const err=document.getElementById("identity-error"); err.textContent=""; if(!name||!email){ err.textContent="Name and email address are required."; return; } if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent="The email address format is invalid."; return; } if(!email.endsWith("@"+cfg.domain.toLowerCase())){ err.textContent="The address must use the @"+cfg.domain+" domain."; return; } if(identities.some(i=>i.email===email)){ err.textContent="This sender name already exists."; return; } identities.push({id:Date.now(), name:name, email:email}); saveIdent(); render(); toast("Sender name added."); }
function removeIdentity(email){ identities=identities.filter(i=>i.email!==email); saveIdent(); render(); }
function disconnect(){ if(!confirm("Disconnect? The Worker URL and password will be removed from this browser.")) return; cfg.proxyUrl=""; cfg.proxyPassword=""; saveCfg(); state.messages=[]; state.setupStep=1; render(); }
function goTab(t){ if(t==="addresses") t="inbox"; state.tab=t; render(); if(t==="inbox" && configured() && !state.messages.length) loadInbox(); }
function onSearch(v){ state.search=v; if(state.tab!=="inbox"){ state.tab="inbox"; render(); const el=document.getElementById("search-input"); if(el){el.value=v; el.focus();} } else render(); }
function render(){
  if(state.mode==="guest"){
    if(!guestBase()){
      app.innerHTML='<header class="header"><div class="header-in"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2.5" width="8" height="6" rx="1" fill="#fff" stroke="none"/><rect x="2.5" y="8" width="19" height="11.5" rx="2"/><path d="M3.5 9.5 12 15.5l8.5-6"/></svg></span><span><span class="brand-name">TheMail</span><br><span class="brand-sub">@'+esc(cfg.domain)+'</span></span></div>'+statusPill()+themeBtn()+'</div></header>'
        +'<div class="shell"><main class="main"><div class="card card-pad" style="text-align:center"><div style="font-size:40px">✉</div><h1 style="margin:8px 0 6px">Guest mode is not active yet</h1><p class="muted" style="margin:0">This copy has not been connected to the public Worker yet. The owner needs to enter the Worker URL first.</p></div></main></div>';
      renderToast(); return;
    }
    app.innerHTML='<header class="header"><div class="header-in"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2.5" width="8" height="6" rx="1" fill="#fff" stroke="none"/><rect x="2.5" y="8" width="19" height="11.5" rx="2"/><path d="M3.5 9.5 12 15.5l8.5-6"/></svg></span><span><span class="brand-name">TheMail</span><br><span class="brand-sub">Temporary address</span></span></div>'+statusPill()+themeBtn()+'</div></header>'
      +'<div class="shell"><main class="main"><div class="page-head"><h1>Guest Inbox</h1><span class="spacer"></span><span class="small">'+esc(state.guestAddress||"")+'</span></div>'+guestHtml()+'</main></div>'
      + guestReadHtml();
    renderToast(); loadAttPreviews(); return;
  }
  const unread=unreadCount();
  const unreadShown = state.activeAddress ? filteredMessages().filter(m=>!readFlags[m.id]).length : unread;
  const needsSetup = !configured();
  let main="";
  if(needsSetup){
    main = stepsHtml() + wizardHtml();
  } else if(state.tab==="inbox"){
    main = '<div class="card controls-card">' + addrChipsHtml() + '<div class="toolbar"><div class="search"><span>'+ic('search')+'</span><input id="search-input" type="search" placeholder="Search sender or subject…" value="'+esc(state.search)+'" oninput="onSearch(this.value)"></div><button class="btn" onclick="loadInbox()" '+(state.loading?"disabled":"")+'><span class="'+(state.loading?"spin":"")+'">'+ic('refresh')+'</span> Check now</button><button class="btn'+(state.unreadOnly?" on":"")+'" onclick="toggleUnreadOnly()">Unread only'+(unread?(" ("+unread+")"):"")+'</button></div>'
      +'<p class="ctl-note">'+(state.lastSync?("Last checked: "+esc(new Date(state.lastSync).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}))+" · checked automatically every 2 minutes while this page is open"):"Press Check now to check for incoming mail.")+'</p>'
      +'</div>' + addrManageHtml() + listHtml();
  }
  else if(state.tab==="sent") main=sentHtml();
  else main=settingsHtml();

  const pageTitle = needsSetup ? "Set up first — it only takes a moment" : state.tab==="inbox" ? "Inbox" : state.tab==="sent" ? "Sent" : "Settings";
  const pageSub = needsSetup ? "3 steps, no technical jargon." : state.tab==="sent" ? "Only stored on this device." : state.tab==="settings" ? "Connection, sender names, and quota info." : (state.activeAddress ? esc(state.activeAddress) : "@"+esc(cfg.domain));

  app.innerHTML='<header class="header"><div class="header-in"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2.5" width="8" height="6" rx="1" fill="#fff" stroke="none"/><rect x="2.5" y="8" width="19" height="11.5" rx="2"/><path d="M3.5 9.5 12 15.5l8.5-6"/></svg></span><span><span class="brand-name">TheMail</span><br><span class="brand-sub">@'+esc(cfg.domain)+'</span></span></div>'+statusPill()+themeBtn()+'</div></header>'
    +'<div class="shell">'
    +(needsSetup?"":'<aside class="sidebar"><button class="side-btn" onclick="newCompose()">'+ic('compose')+'Compose new email</button><div style="height:8px"></div><button class="side-btn '+(state.tab==="inbox"?"active":"")+'" onclick="goTab(\'inbox\')">'+ic('inbox')+'Inbox'+(unread?'<span class="count">'+unread+'</span>':"")+'</button><button class="side-btn '+(state.tab==="sent"?"active":"")+'" onclick="goTab(\'sent\')">'+ic('send')+'Sent</button><button class="side-btn '+(state.tab==="settings"?"active":"")+'" onclick="goTab(\'settings\')">'+ic('sliders')+'Settings</button><p class="side-note">Mail to any @'+esc(cfg.domain)+' address arrives automatically. No need to create addresses one by one.</p></aside>')
    +'<main class="main"><div class="page-head"><h1>'+esc(pageTitle)+'</h1>'+(state.tab==="inbox"&&unreadShown&&!needsSetup?'<span class="chip chip-accent">'+unreadShown+" unread</span>":"")+'<span class="spacer"></span><span class="small">'+esc(pageSub)+'</span></div>'
    + main + "</main></div>"
    +(needsSetup?"":'<button class="fab" onclick="newCompose()">'+ic('compose')+'Compose</button>')
    +(needsSetup?"":'<nav class="bottomnav"><button class="'+(state.tab==="inbox"?"active":"")+'" onclick="goTab(\'inbox\')">'+ic('inbox')+'<br>Inbox'+(unread?" ("+unread+")":"")+'</button><button class="'+(state.tab==="sent"?"active":"")+'" onclick="goTab(\'sent\')">'+ic('send')+'<br>Sent</button><button class="'+(state.tab==="settings"?"active":"")+'" onclick="goTab(\'settings\')">'+ic('sliders')+'<br>Settings</button></nav>')
    + readHtml() + composeHtml();
  renderToast();
  renderAttList();
  loadAttPreviews();
}
/* Init */
/* Migrasi: alamat tamu lama (sebelum ada batas 3) dihitung sebagai alamat ke-1. */
if(!Array.isArray(state.guestCreated)) state.guestCreated=[];
state.guestCreated=state.guestCreated.filter(e=>typeof e==="string" && /^tmp-[a-z0-9]{10}@/.test(e)).slice(0,3);
if(!state.guestCreated.length && state.guestAddress){ state.guestCreated=[state.guestAddress]; saveGuestCreated(); }
/* Boot: halaman utama langsung mode Tamu; /admin langsung mode Pemilik. */
if(BOOT_MODE==="owner"){ state.mode="owner"; } else { state.mode="guest"; }
if(!configured()){ state.setupStep=1; }
else if(!identities.length){ state.setupStep=2; }
if(state.theme==="dark") document.documentElement.setAttribute("data-theme","dark");
render();
if(state.mode==="owner" && configured()) loadInbox();
if(state.mode==="guest"){ if(!state.guestAddress){ enterGuest(); } else { loadGuestInbox(); } }
</script>
